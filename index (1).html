.price{color:var(--gold);font-weight:800;font-size:1.1rem}.tag{font-size:.8rem;color:var(--mut)}
.note{font-size:.85rem;color:var(--mut);margin-top:10px}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--brand);color:var(--btn);border:0;border-radius:30px;padding:14px 18px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#chat{position:fixed;right:12px;left:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:400px;margin-left:auto;height:min(70vh,520px);background:var(--card);border:1px solid var(--bd);border-radius:16px;display:none;flex-direction:column;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.3);overflow:hidden}
#chat.open{display:flex}
#chat .hd{background:var(--brand);color:var(--btn);padding:12px 14px;font-weight:700}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;font-size:.95rem}
.m.u{align-self:flex-end;background:var(--brand);color:var(--btn)}.m.b{align-self:flex-start;background:var(--bg);border:1px solid var(--bd)}
#cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}
#cf input{flex:1;min-width:0;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
#cf button{border:0;background:var(--gold);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
.lgo{border-radius:50%;object-fit:cover;background:#000}
.f label{display:block;font-weight:600;margin:10px 0 4px}.f input,.f select,.f textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:16px;padding:6px 10px;font-size:.85rem;cursor:pointer}
footer{text-align:center;padding:24px 16px 90px;color:var(--mut);border-top:1px solid var(--bd)}
</style>
